# TulsiOS: merge upstream nixos-unstable into tulsi-unstable every day.
# The merge is only pushed if it builds; conflicts open an issue instead.
# Needs secret SYNC_TOKEN (fine-grained PAT on this repo: Contents + Workflows
# read/write), because upstream merges change .github/workflows.
name: tulsi-sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Full history, but no file contents until needed (blob:none): a shallow
      # history hides the real merge base, and git then invents conflicts in
      # files TulsiOS never touched.
      - uses: actions/checkout@v4
        with:
          ref: tulsi-unstable
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream nixos-unstable
        id: merge
        run: |
          git config user.name "tulsi-sync"
          git config user.email "tulsi-sync@users.noreply.github.com"
          git remote add upstream https://github.com/NixOS/nixpkgs.git
          git fetch --filter=blob:none upstream nixos-unstable
          UP=upstream/nixos-unstable
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "Already up to date."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Files TulsiOS changes relative to upstream, before the merge.
          git diff --name-only "$(git merge-base HEAD "$UP")" HEAD | sort > ours.txt
          if git merge --no-edit -m "Merge upstream nixos-unstable $(git rev-parse --short "$UP")" "$UP"; then
            # After a correct merge, only TulsiOS's own files differ from upstream.
            git diff --name-only "$UP" HEAD | sort > after.txt
            if [ -n "$(comm -13 ours.txt after.txt)" ]; then
              echo "::error::The merge differs from upstream in files TulsiOS does not change:"
              comm -13 ours.txt after.txt
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | sort > conflicts.txt
            # Fast-tracked agents (tulsi-agents.yml): when nixpkgs has bumped an agent
            # that tulsipkgs updated ahead of it, take upstream's files. If upstream is
            # still older, the next tulsi-agents run proposes the newer version again.
            git log --format= --name-only --grep '^tulsi-agents:' "$(git merge-base HEAD "$UP")"..HEAD \
              | sed '/^$/d' | sort -u > agent-files.txt
            if [ -s conflicts.txt ] && [ -z "$(comm -23 conflicts.txt agent-files.txt)" ]; then
              echo "Taking upstream's version of fast-tracked agent files:"; cat conflicts.txt
              xargs git checkout --theirs -- < conflicts.txt
              xargs git add -- < conflicts.txt
              git commit --no-edit
              git diff --name-only "$UP" HEAD | sort > after.txt
              if [ -n "$(comm -13 ours.txt after.txt)" ]; then
                echo "::error::The merge differs from upstream in files TulsiOS does not change:"
                comm -13 ours.txt after.txt
                exit 1
              fi
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Report conflicts
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Merging upstream nixos-unstable into tulsi-unstable conflicts in:"
            echo; sed 's/^/- `/; s/$/`/' conflicts.txt
            echo; echo "Resolve locally (see TULSI.md, \"Upstream sync\") and push."
          } > body.md
          gh issue create --title "tulsi-sync: merge conflict $(date -u +%F)" --body-file body.md
          exit 1

      - uses: cachix/install-nix-action@v31
        if: steps.merge.outputs.changed == 'true'

      - name: Build the merged tree
        if: steps.merge.outputs.changed == 'true'
        run: |
          nix-build pkgs/top-level/tulsi-release.nix -A built --no-out-link --keep-going
          ci/tulsi/check-upstream.sh

      - name: Push the merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:tulsi-unstable
